    <path d="M160 40 L400 40 L510 130 L545 640 L455 650 L430 240 L430 690 C430 715 300 725 280 680 C260 725 130 715 130 690 L130 240 L105 650 L15 640 L50 130 Z" fill="#30302E" stroke="#30302E" stroke-width="6" stroke-linejoin="round"/>
    <!-- Contrast Olive Lapels -->
    <path d="M210 40 L280 330 L170 210 L195 110 L165 95 Z" fill="#808060" stroke="#30302E" stroke-width="5" stroke-linejoin="round"/>
    <path d="M350 40 L280 330 L390 210 L365 110 L395 95 Z" fill="#808060" stroke="#30302E" stroke-width="5" stroke-linejoin="round"/>
