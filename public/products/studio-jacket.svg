    <path d="M345 195 L368 170 L388 195 Z" fill="#C8784C" stroke="#30302E" stroke-width="3"/>
    <rect x="335" y="195" width="62" height="18" rx="3" fill="#808060" stroke="#30302E" stroke-width="3"/>
    <!-- Lower Flap Pockets -->
    <rect x="148" y="470" width="95" height="32" rx="6" fill="#808060" stroke="#30302E" stroke-width="4"/>
    <rect x="317" y="470" width="95" height="32" rx="6" fill="#808060" stroke="#30302E" stroke-width="4"/>
    <!-- Center Buttons & Stitch Line -->
    <line x1="280" y1="330" x2="280" y2="680" stroke="#E9D7BF" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="264" cy="390" r="8" fill="#808060" stroke="#E9D7BF" stroke-width="2"/>
    <circle cx="264" cy="455" r="8" fill="#808060" stroke="#E9D7BF" stroke-width="2"/>
    <circle cx="264" cy="520" r="8" fill="#808060" stroke="#E9D7BF" stroke-width="2"/>
  </g>
</svg>
